# EN: Configure DNS records automatically using Technitium
# ES: Configurar registros DNS automáticamente usando Technitium

---
- name: Configurar DNS automático con Technitium
  hosts: clientes
  gather_facts: false

  vars_files:
    - ../inventory/group_vars/clientes/main.yml

  become: false

  tasks:

    # EN: Initialize DNS records list
    # ES: Inicializar lista de registros DNS
    - name: Inicializar dns_records generados
      set_fact:
        dns_records: []

    # EN: Generate DNS records from enabled client services
    # ES: Generar registros DNS desde servicios activos del cliente
    - name: Generar dns_records desde cliente_servicios
      set_fact:
        dns_records: "{{ dns_records + [ {
          'name': servicios_catalogo[item].domain_prefix,
          'zone': cliente_subdomain ~ '.lab.local',
          'ip': cliente_ip
        } ] }}"
      loop: "{{ cliente_servicios }}"
      when:
        - servicios_catalogo[item] is defined
        - servicios_catalogo[item].internal_only | default(false) == false

    # EN: Authenticate against Technitium API
    # ES: Autenticarse contra la API de Technitium
    - name: Login en Technitium DNS
      uri:
        url: "http://{{ ansible_host }}:5380/api/user/login"
        method: POST
        body_format: form-urlencoded
        body:
          user: "{{ technitium_username }}"
          pass: "{{ technitium_password }}"
        return_content: yes
        status_code: 200
      register: technitium_login
      delegate_to: localhost
      retries: 20
      delay: 5
      until:
        - technitium_login.json is defined
        - technitium_login.json.status == "ok"
        - technitium_login.json.token is defined

    - name: Guardar token Technitium
      set_fact:
        technitium_token: "{{ technitium_login.json.token }}"

    # EN: Create DNS zone if it does not exist
    # ES: Crear zona DNS si no existe
    - name: Crear zona DNS si no existe
      uri:
        url: "{{ technitium_url }}/api/zones/create"
        method: POST
        body_format: form-urlencoded
        body:
          token: "{{ technitium_token }}"
          zone: "{{ cliente_subdomain }}.lab.local"
          type: "Primary"
        return_content: true
      register: create_zone_result
      failed_when: false
      changed_when: "'ok' in create_zone_result.content"
      delegate_to: localhost

    # EN: Create or overwrite DNS A records
    # ES: Crear o sobrescribir registros DNS tipo A
    - name: Crear registros A en Technitium
      uri:
        url: "{{ technitium_url }}/api/zones/records/add"
        method: POST
        body_format: form-urlencoded
        body:
          token: "{{ technitium_token }}"
          domain: "{{ item.name }}.{{ item.zone }}"
          zone: "{{ item.zone }}"
          type: "A"
          ipAddress: "{{ item.ip }}"
          ttl: "3600"
          overwrite: "true"
        return_content: true
      loop: "{{ dns_records }}"
      register: dns_records_result
      failed_when: false
      changed_when: "'ok' in dns_records_result.content"
      delegate_to: localhost

    # EN: Remove DNS records for disabled services
    # ES: Eliminar registros DNS de servicios desactivados
    - name: Eliminar registros DNS ausentes en Technitium
      uri:
        url: "{{ technitium_url }}/api/zones/records/delete"
        method: POST
        body_format: form-urlencoded
        body:
          token: "{{ technitium_token }}"
          domain: "{{ item.domain }}"
          zone: "{{ item.zone }}"
          type: "A"
          ipAddress: "{{ cliente_ip }}"
        return_content: true
      loop: "{{ dns_records_absent | default([]) }}"
      register: dns_delete_result
      failed_when: false
      changed_when: "'ok' in dns_delete_result.content"
      delegate_to: localhost

    - name: Mostrar DNS eliminados
      debug:
        msg: "DNS eliminado -> {{ item.item.domain }}"
      loop: "{{ dns_delete_result.results | default([]) }}"

    - name: Mostrar resultado DNS
      debug:
        msg: "DNS configurado -> {{ item.item.name }}.{{ item.item.zone }} -> {{ item.item.ip }}"
      loop: "{{ dns_records_result.results }}"
