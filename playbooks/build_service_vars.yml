# EN: Generate dynamic MSP service variables
# ES: Generar variables dinámicas de servicios MSP

---
- name: Generar variables dinámicas de servicios MSP
  hosts: clientes
  gather_facts: false

  tasks:

    # EN: Initialize generated services list
    # ES: Inicializar lista de servicios generados
    - name: Inicializar cliente_servicios generados desde flags
      set_fact:
        generated_cliente_servicios: []

    - name: Añadir nginx-test si está activado
      set_fact:
        generated_cliente_servicios: "{{ generated_cliente_servicios + ['nginx-test'] }}"
      when: apps.nginx_test | default(false)

    - name: Añadir nginx-proxy-manager si reverse_proxy está activado
      set_fact:
        generated_cliente_servicios: "{{ generated_cliente_servicios + ['nginx-proxy-manager'] }}"
      when: core_services.reverse_proxy | default(false)

    - name: Añadir portainer-agent si está activado
      set_fact:
        generated_cliente_servicios: "{{ generated_cliente_servicios + ['portainer-agent'] }}"
      when: apps.portainer_agent | default(false)

    - name: Añadir vaultwarden si está activado
      set_fact:
        generated_cliente_servicios: "{{ generated_cliente_servicios + ['vaultwarden'] }}"
      when: apps.vaultwarden | default(false)

    - name: Añadir uptime-kuma si está activado
      set_fact:
        generated_cliente_servicios: "{{ generated_cliente_servicios + ['uptime-kuma'] }}"
      when: apps.uptime_kuma | default(false)

    - name: Añadir technitium si está activado
      set_fact:
        generated_cliente_servicios: "{{ generated_cliente_servicios + ['technitium'] }}"
      when: apps.technitium | default(false)

    - name: Añadir nextcloud si está activado
      set_fact:
        generated_cliente_servicios: "{{ generated_cliente_servicios + ['nextcloud'] }}"
      when: apps.nextcloud | default(false)

    - name: Añadir duplicati si está activado
      set_fact:
        generated_cliente_servicios: "{{ generated_cliente_servicios + ['duplicati'] }}"
      when: apps.duplicati | default(false)

    - name: Añadir homepage si está activado
      set_fact:
        generated_cliente_servicios: "{{ generated_cliente_servicios + ['homepage'] }}"
      when: core_services.homepage | default(false)

    # EN: Final generated services list
    # ES: Lista final de servicios generados
    - name: Usar cliente_servicios generados desde flags
      set_fact:
        cliente_servicios: "{{ generated_cliente_servicios }}"

    # EN: Initialize Docker stacks list
    # ES: Inicializar lista de stacks Docker
    - name: Inicializar docker_stacks generados
      set_fact:
        generated_docker_stacks: []

    # EN: Build Docker stacks dynamically
    # ES: Construir stacks Docker dinámicamente
    - name: Generar docker_stacks desde cliente_servicios
      set_fact:
        generated_docker_stacks: "{{ generated_docker_stacks + [item] }}"
      loop: "{{ cliente_servicios }}"
      when:
        - servicios_catalogo[item] is defined

    - name: Mostrar docker_stacks generados
      debug:
        var: generated_docker_stacks

    # EN: Generate repositories automatically
    # ES: Generar repositorios automáticamente
    - name: Generar deploy_repositories automático
      set_fact:
        generated_deploy_repositories:
          - repo_name: "msp-docker-apps"
            repo_url: "git@github.com:Harlock-code/msp-docker-apps.git"
            docker_stacks: "{{ generated_docker_stacks | difference(['nginx-proxy-manager']) }}"

          - repo_name: "msp-docker-infrastructure"
            repo_url: "git@github.com:Harlock-code/msp-docker-infrastructure.git"
            docker_stacks:
              - nginx-proxy-manager

    - name: Mostrar deploy_repositories generados
      debug:
        var: generated_deploy_repositories

    # EN: Initialize reverse proxy hosts
    # ES: Inicializar hosts reverse proxy
    - name: Inicializar proxy_hosts generados
      set_fact:
        proxy_hosts: []

    # EN: Initialize DNS records
    # ES: Inicializar registros DNS
    - name: Inicializar dns_records generados
      set_fact:
        dns_records: []

    # EN: Generate reverse proxy hosts dynamically
    # ES: Generar hosts reverse proxy dinámicamente
    - name: Generar proxy_hosts desde cliente_servicios
      set_fact:
        proxy_hosts: "{{ proxy_hosts + [ {
          'domain': servicios_catalogo[item].domain_prefix ~ '.' ~ cliente_subdomain ~ '.lab.local',
          'forward_host': servicios_catalogo[item].forward_host,
          'forward_port': servicios_catalogo[item].forward_port,
          'cert_name': servicios_catalogo[item].cert_name,
          'cert_file': servicios_catalogo[item].domain_prefix ~ '.' ~ cliente_subdomain ~ '.lab.local.crt',
          'key_file': servicios_catalogo[item].domain_prefix ~ '.' ~ cliente_subdomain ~ '.lab.local.key'
        } ] }}"
      loop: "{{ cliente_servicios }}"
      when:
        - servicios_catalogo[item] is defined
        - servicios_catalogo[item].internal_only | default(false) == false

    - name: Mapear proxy_hosts generados a variable esperada por reverse_proxy
      set_fact:
        npm_proxy_hosts_desired: "{{ proxy_hosts }}"

    # EN: Generate DNS records dynamically
    # ES: Generar registros DNS dinámicamente
    - name: Generar dns_records desde cliente_servicios
      set_fact:
        dns_records: "{{ dns_records + [ {
          'name': servicios_catalogo[item].domain_prefix,
          'zone': cliente_subdomain ~ '.lab.local',
          'ip': cliente_ip
        } ] }}"
      loop: "{{ cliente_servicios }}"
      when:
        - servicios_catalogo[item] is defined
        - servicios_catalogo[item].internal_only | default(false) == false

    # EN: Build absent services list
    # ES: Construir lista de servicios ausentes
    - name: Build absent apps list
      set_fact:
        absent_services: "{{ absent_services | default([]) + [ item.key | replace('_', '-') ] }}"
      loop: "{{ apps | dict2items }}"
      when:
        - item.value is boolean
        - item.value == false
        - item.key | replace('_', '-') in servicios_catalogo
        - item.key in apps_absent_manage | default([])

    - name: Build absent core services list
      set_fact:
        absent_services: "{{ absent_services | default([]) + [item.key] }}"
      loop: "{{ core_services | dict2items }}"
      when:
        - item.value is boolean
        - item.value == false
        - item.key in servicios_catalogo

    - name: Mostrar absent_services
      debug:
        var: absent_services

    # EN: Initialize absent reverse proxy hosts
    # ES: Inicializar hosts reverse proxy ausentes
    - name: Inicializar npm_proxy_hosts_absent
      set_fact:
        npm_proxy_hosts_absent: []

    # EN: Generate reverse proxy hosts to remove
    # ES: Generar hosts reverse proxy a eliminar
    - name: Generar npm_proxy_hosts_absent desde absent_services
      set_fact:
        npm_proxy_hosts_absent: >-
          {{
            npm_proxy_hosts_absent + [
              {
                "service": item,
                "domain": servicios_catalogo[item].domain_prefix ~ "." ~ cliente_subdomain ~ ".lab.local"
              }
            ]
          }}
      loop: "{{ absent_services | default([]) }}"
      when:
        - servicios_catalogo[item] is defined
        - servicios_catalogo[item].domain_prefix is defined
        - servicios_catalogo[item].internal_only | default(false) == false

    - name: Mostrar npm_proxy_hosts_absent
      debug:
        var: npm_proxy_hosts_absent

    # EN: Initialize absent DNS records
    # ES: Inicializar registros DNS ausentes
    - name: Inicializar dns_records_absent
      set_fact:
        dns_records_absent: []

    # EN: Generate DNS records to remove
    # ES: Generar registros DNS a eliminar
    - name: Generar dns_records_absent desde absent_services
      set_fact:
        dns_records_absent: >-
          {{
            dns_records_absent + [
              {
                "service": item,
                "name": servicios_catalogo[item].domain_prefix,
                "zone": cliente_subdomain ~ ".lab.local",
                "domain": servicios_catalogo[item].domain_prefix ~ "." ~ cliente_subdomain ~ ".lab.local"
              }
            ]
          }}
      loop: "{{ absent_services | default([]) }}"
      when:
        - servicios_catalogo[item] is defined
        - servicios_catalogo[item].domain_prefix is defined
        - servicios_catalogo[item].internal_only | default(false) == false

    - name: Mostrar dns_records_absent
      debug:
        var: dns_records_absent

    - name: Mostrar proxy_hosts generados
      debug:
        var: proxy_hosts

    - name: Mostrar dns_records generados
      debug:
        var: dns_records
