# EN: Initial bootstrap for MSP client access
# ES: Bootstrap inicial para acceso de cliente MSP

---
- name: Bootstrap inicial de acceso para cliente MSP
  hosts: clientes
  become: true
  gather_facts: false

  vars:

    # EN: Administrative user created by Ansible
    # ES: Usuario administrador creado por Ansible
    ansible_admin_user: "javi"

  pre_tasks:

    # EN: Install Python if missing
    # ES: Instalar Python si no existe
    - name: Instalar Python si no existe
      raw: |
        test -e /usr/bin/python3 || (apt update && apt install -y python3)
      changed_when: false

  tasks:

    # EN: Install required base packages
    # ES: Instalar paquetes base necesarios
    - name: Instalar paquetes base mínimos
      apt:
        name:
          - sudo
          - rsync
          - curl
          - ca-certificates
          - openssh-server
          - python3
        state: present
        update_cache: yes

    # EN: Create administrative user
    # ES: Crear usuario administrador
    - name: Crear usuario administrador
      user:
        name: "{{ ansible_admin_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true

    # EN: Allow passwordless sudo
    # ES: Permitir sudo sin contraseña
    - name: Permitir sudo sin contraseña para usuario admin
      copy:
        dest: "/etc/sudoers.d/{{ ansible_admin_user }}"
        content: "{{ ansible_admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"

    # EN: Create SSH directory for admin user
    # ES: Crear directorio SSH para usuario admin
    - name: Crear directorio .ssh del usuario admin
      file:
        path: "/home/{{ ansible_admin_user }}/.ssh"
        state: directory
        owner: "{{ ansible_admin_user }}"
        group: "{{ ansible_admin_user }}"
        mode: "0700"

    # EN: Install Ansible public SSH key
    # ES: Instalar clave pública SSH de Ansible
    - name: Instalar clave pública de Ansible
      authorized_key:
        user: "{{ ansible_admin_user }}"
        state: present
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    # EN: Ensure SSH service is running
    # ES: Asegurar que SSH esté activo
    - name: Asegurar SSH activo
      service:
        name: ssh
        state: started
        enabled: true
