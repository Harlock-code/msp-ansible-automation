---
- name: Crear directorio local de certificados PKI
  ansible.builtin.file:
    path: "/opt/msp-pki"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: true
  become: false

- name: Crear clave privada wildcard del cliente
  ansible.builtin.command: >
    openssl genrsa
    -out /opt/msp-pki/wildcard.{{ cliente_dominio }}.key
    2048
  args:
    creates: "/opt/msp-pki/wildcard.{{ cliente_dominio }}.key"
  delegate_to: localhost
  become: false

- name: Crear archivo OpenSSL SAN para wildcard
  ansible.builtin.copy:
    dest: "/opt/msp-pki/wildcard.{{ cliente_dominio }}.cnf"
    mode: "0644"
    content: |
      [req]
      distinguished_name = req_distinguished_name
      req_extensions = v3_req
      prompt = no

      [req_distinguished_name]
      CN = *.{{ cliente_dominio }}

      [v3_req]
      subjectAltName = @alt_names

      [alt_names]
      DNS.1 = *.{{ cliente_dominio }}
      DNS.2 = {{ cliente_dominio }}
  delegate_to: localhost
  become: false

- name: Crear CSR wildcard del cliente
  ansible.builtin.command: >
    openssl req -new
    -key /opt/msp-pki/wildcard.{{ cliente_dominio }}.key
    -out /opt/msp-pki/wildcard.{{ cliente_dominio }}.csr
    -config /opt/msp-pki/wildcard.{{ cliente_dominio }}.cnf
  args:
    creates: "/opt/msp-pki/wildcard.{{ cliente_dominio }}.csr"
  delegate_to: localhost
  become: false

- name: Crear certificado wildcard firmado por CA local
  ansible.builtin.command: >
    openssl x509 -req
    -in /opt/msp-pki/wildcard.{{ cliente_dominio }}.csr
    -CA /opt/msp-pki/msp-root-ca.crt
    -CAkey /opt/msp-pki/msp-root-ca.key
    -CAcreateserial
    -out /opt/msp-pki/wildcard.{{ cliente_dominio }}.crt
    -days 825
    -sha256
    -extensions v3_req
    -extfile /opt/msp-pki/wildcard.{{ cliente_dominio }}.cnf
  args:
    creates: "/opt/msp-pki/wildcard.{{ cliente_dominio }}.crt"
  delegate_to: localhost
  become: false
