# EN: Update apt package cache
# ES: Actualizar caché de paquetes apt

---
- name: Update apt cache
  apt:
    update_cache: yes

# EN: Install common administration tools
# ES: Instalar herramientas comunes de administración
- name: Install base admin packages
  apt:
    name:
      - curl
      - git
      - htop
      - vim
      - net-tools
      - unzip
      - ca-certificates
      - gnupg
      - lsb-release
    state: present
