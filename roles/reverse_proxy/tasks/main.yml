# EN: Configure Nginx Proxy Manager automatically
# ES: Configurar Nginx Proxy Manager automáticamente

---
# EN: Authenticate against NPM API
# ES: Autenticarse contra la API de NPM
- name: Authenticate against Nginx Proxy Manager API
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ npm_api_port | default(81) }}/api/tokens"
    method: POST
    body_format: json
    body:
      identity: "{{ npm_email }}"
      secret: "{{ npm_password }}"
    status_code: 200
    return_content: true
  register: npm_auth
  retries: 5
  delay: 3
  until:
    - npm_auth.json is defined
    - npm_auth.json.token is defined
  no_log: true

- name: Show NPM auth status
  ansible.builtin.debug:
    msg: "Authenticated against Nginx Proxy Manager API"

# EN: Retrieve existing SSL certificates
# ES: Obtener certificados SSL existentes
- name: Get existing certificates from NPM
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ npm_api_port | default(81) }}/api/nginx/certificates"
    method: GET
    headers:
      Authorization: "Bearer {{ npm_auth.json.token }}"
    return_content: true
    status_code: 200
  register: npm_existing_certs
  no_log: true

# EN: Create wildcard certificate entry if missing
# ES: Crear entrada de certificado wildcard si no existe
- name: Create wildcard certificate in NPM if missing
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ npm_api_port | default(81) }}/api/nginx/certificates"
    method: POST
    headers:
      Authorization: "Bearer {{ npm_auth.json.token }}"
    body_format: json
    body:
      provider: "other"
      nice_name: "wildcard-{{ cliente_dominio }}"
    status_code: 201
    return_content: true
  when: >
    ('wildcard-' ~ cliente_dominio) not in
    (npm_existing_certs.json | map(attribute='nice_name') | list)
  register: npm_wildcard_created
  no_log: true

# EN: Refresh certificates list
# ES: Actualizar lista de certificados
- name: Refresh certificates from NPM
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ npm_api_port | default(81) }}/api/nginx/certificates"
    method: GET
    headers:
      Authorization: "Bearer {{ npm_auth.json.token }}"
    return_content: true
    status_code: 200
  register: npm_all_certs
  no_log: true

- name: Refresh certificates after wildcard creation
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ npm_api_port | default(81) }}/api/nginx/certificates"
    method: GET
    headers:
      Authorization: "Bearer {{ npm_auth.json.token }}"
    return_content: true
    status_code: 200
  register: npm_all_certs
  no_log: true

# EN: Save wildcard certificate ID
# ES: Guardar ID del certificado wildcard
- name: Set wildcard certificate ID
  ansible.builtin.set_fact:
    npm_wildcard_cert_id: >-
      {{
        (
          npm_all_certs.json
          | selectattr('nice_name', 'equalto', 'wildcard-' ~ cliente_dominio)
          | map(attribute='id')
          | first
        ) | default(0)
      }}

# EN: Upload wildcard certificate and private key
# ES: Subir certificado wildcard y clave privada
- name: Upload wildcard certificate and key
  ansible.builtin.command: >
    curl -s -X POST "http://{{ ansible_host }}:{{ npm_api_port | default(81) }}/api/nginx/certificates/{{
      (
        npm_all_certs.json
        | selectattr('nice_name', 'equalto', 'wildcard-' ~ cliente_dominio)
        | list
      )[0].id
    }}/upload"
    -H "Authorization: Bearer {{ npm_auth.json.token }}"
    -F "certificate=@/opt/msp-pki/wildcard.{{ cliente_dominio }}.crt"
    -F "certificate_key=@/opt/msp-pki/wildcard.{{ cliente_dominio }}.key"
  when: npm_wildcard_created is defined
  delegate_to: localhost
  become: false
  changed_when: true
  no_log: false

- name: Refresh certificates after upload
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ npm_api_port | default(81) }}/api/nginx/certificates"
    method: GET
    headers:
      Authorization: "Bearer {{ npm_auth.json.token }}"
    return_content: true
    status_code: 200
  register: npm_all_certs
  no_log: true

# EN: Retrieve existing proxy hosts
# ES: Obtener proxy hosts existentes
- name: Get existing proxy hosts
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ npm_api_port | default(81) }}/api/nginx/proxy-hosts"
    method: GET
    headers:
      Authorization: "Bearer {{ npm_auth.json.token }}"
    return_content: true
    status_code: 200
  register: npm_proxy_hosts
  no_log: true

# EN: Remove proxy hosts for disabled services
# ES: Eliminar proxy hosts de servicios desactivados
- name: Delete absent proxy hosts from NPM
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ npm_api_port | default(81) }}/api/nginx/proxy-hosts/{{ item_id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ npm_auth.json.token }}"
    status_code: 200
  vars:
    item_id: >-
      {{
        (
          npm_proxy_hosts.json
          | selectattr('domain_names', 'contains', item.domain)
          | map(attribute='id')
          | first
        )
      }}
  loop: "{{ npm_proxy_hosts_absent | default([]) }}"
  when:
    - npm_proxy_hosts_absent is defined
    - item.domain in (npm_proxy_hosts.json | map(attribute='domain_names') | flatten | list)

# EN: Update existing proxy hosts with SSL
# ES: Actualizar proxy hosts existentes con SSL
- name: Update existing proxy hosts with SSL certificate
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ npm_api_port | default(81) }}/api/nginx/proxy-hosts/{{ item_id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ npm_auth.json.token }}"
    body_format: json
    body:
      domain_names:
        - "{{ item.domain }}"
      forward_scheme: "{{ item.scheme | default('http') }}"
      forward_host: "{{ item.forward_host }}"
      forward_port: "{{ item.forward_port }}"
      access_list_id: 0
      certificate_id: "{{ npm_wildcard_cert_id }}"
      ssl_forced: "{{ item.ssl_forced | default(true) }}"
      caching_enabled: "{{ item.caching_enabled | default(false) }}"
      block_exploits: "{{ item.block_exploits | default(true) }}"
      allow_websocket_upgrade: "{{ item.websocket | default(true) }}"
      http2_support: true
      hsts_enabled: "{{ item.hsts_enabled | default(false) }}"
      hsts_subdomains: "{{ item.hsts_subdomains | default(false) }}"
      locations: []
      advanced_config: "{{ item.advanced_config | default('') }}"
      meta: {}
    status_code: 200
  vars:
    item_id: >-
      {{
        (
          npm_proxy_hosts.json
          | selectattr('domain_names', 'contains', item.domain)
          | map(attribute='id')
          | first
        )
      }}
  loop: "{{ proxy_hosts }}"
  when:
    - item.domain in (npm_proxy_hosts.json | map(attribute='domain_names') | flatten | list)
    - npm_wildcard_cert_id | int > 0

# EN: Create missing proxy hosts
# ES: Crear proxy hosts faltantes
- name: Create proxy hosts
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ npm_api_port | default(81) }}/api/nginx/proxy-hosts"
    method: POST
    headers:
      Authorization: "Bearer {{ npm_auth.json.token }}"
    body_format: json
    body:
      domain_names:
        - "{{ item.domain }}"
      forward_scheme: "{{ item.scheme | default('http') }}"
      forward_host: "{{ item.forward_host }}"
      forward_port: "{{ item.forward_port }}"
      access_list_id: 0
      certificate_id: "{{ npm_wildcard_cert_id }}"
      ssl_forced: "{{ item.ssl_forced | default(true) }}"
      caching_enabled: "{{ item.caching_enabled | default(false) }}"
      block_exploits: "{{ item.block_exploits | default(true) }}"
      allow_websocket_upgrade: "{{ item.websocket | default(true) }}"
      http2_support: "{{ item.http2_support | default(true) }}"
      hsts_enabled: "{{ item.hsts_enabled | default(false) }}"
      hsts_subdomains: "{{ item.hsts_subdomains | default(false) }}"
      locations: []
      advanced_config: "{{ item.advanced_config | default('') }}"
      meta: {}
    status_code: 201
  loop: "{{ proxy_hosts }}"
  when:
    - npm_wildcard_cert_id | int > 0
    - item.domain not in (npm_proxy_hosts.json | map(attribute='domain_names') | flatten | list)
