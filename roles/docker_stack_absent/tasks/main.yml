# EN: Stop and remove Docker stacks marked as disabled
# ES: Detener y eliminar stacks Docker marcados como desactivados

---
- name: Stop and remove disabled Docker stacks
  community.docker.docker_compose_v2:
    project_src: "/opt/repos/{{ servicios_catalogo[item].repo }}/{{ item }}"
    state: absent
    remove_orphans: true
  loop: "{{ absent_services | default([]) }}"
  register: absent_result
  failed_when: false
  changed_when: >
    absent_result.changed | default(false)
  when:
    - absent_services is defined
    - item in servicios_catalogo
    - servicios_catalogo[item].repo is defined
