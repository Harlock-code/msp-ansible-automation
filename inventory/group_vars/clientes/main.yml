# EN: General timezone for deployed services
# ES: Zona horaria general para los servicios desplegados
timezone: "Europe/Madrid"

# EN: Base path where Docker stacks are deployed
# ES: Ruta base donde se despliegan los stacks Docker
docker_base_path: "/opt/stacks"

monitoring_enabled: true

# EN: Client domain configuration
# ES: Configuración de dominio del cliente
cliente_nombre: "cliente"
cliente_subdomain: "cliente"
cliente_dominio: "{{ cliente_subdomain }}.lab.local"

# EN: Service catalog used by Ansible automation
# ES: Catálogo de servicios usado por la automatización Ansible
servicios_catalogo:

  portainer-agent:
    repo: msp-docker-apps
    internal_only: true

  nginx-proxy-manager:
    repo: msp-docker-infrastructure
    domain_prefix: "npm"
    forward_host: "nginx-proxy-manager"
    forward_port: 81
    cert_name: "npm-cliente-lab"
    icon: "nginx-proxy-manager"

  homepage:
    repo: msp-docker-apps
    domain_prefix: "home"
    forward_host: "homepage"
    forward_port: 3000
    cert_name: "home-cliente-lab"
    icon: "homepage"

  vaultwarden:
    repo: msp-docker-apps
    domain_prefix: "vault"
    forward_host: "vaultwarden"
    forward_port: 80
    cert_name: "vault-cliente-lab"
    icon: "vaultwarden"

  uptime-kuma:
    repo: msp-docker-apps
    domain_prefix: "uptime"
    forward_host: "uptime-kuma"
    forward_port: 3001
    cert_name: "uptime-cliente-lab"
    icon: "uptime-kuma"

  technitium:
    repo: msp-docker-apps
    domain_prefix: "dns"
    forward_host: "technitium"
    forward_port: 5380
    cert_name: "dns-cliente-lab"
    icon: "technitium"

  nextcloud:
    repo: msp-docker-apps
    domain_prefix: "nextcloud"
    forward_host: "nextcloud"
    forward_port: 80
    cert_name: "nextcloud-cliente-lab"
    icon: "nextcloud"

  duplicati:
    repo: msp-docker-apps
    domain_prefix: "backup"
    forward_host: "duplicati"
    forward_port: 8200
    cert_name: "backup-cliente-lab"
    icon: "duplicati"

  nginx-test:
    repo: msp-docker-apps
    domain_prefix: "nginx"
    forward_host: "nginx-test"
    forward_port: 80
    cert_name: "nginx-cliente-lab"
    icon: "nginx"

# EN: Git repositories deployed automatically
# ES: Repositorios Git desplegados automáticamente
deploy_repositories:
  - repo_name: "msp-docker-apps"
    repo_url: "git@github.com:Harlock-code/msp-docker-apps.git"

# EN: External Docker networks
# ES: Redes Docker externas
docker_networks:
  - proxy_net
  - monitoring_net
  - backend_net

# EN: Client service endpoints
# ES: Endpoints de servicios del cliente
cliente_ip: "192.168.56.60"
cliente_npm_port: 81
cliente_dns_port: 5380

npm_url: "http://{{ cliente_ip }}:{{ cliente_npm_port }}"
npm_email: "{{ vault_npm_email }}"
npm_password: "{{ vault_npm_password }}"

dns_provider: "technitium"

technitium_url: "http://{{ cliente_ip }}:{{ cliente_dns_port }}"
technitium_username: "admin"
technitium_password: "Template.47"
