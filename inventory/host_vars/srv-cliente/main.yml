# EN: Client domain configuration
# ES: Configuración de dominio del cliente
cliente_nombre: "cliente"
cliente_subdomain: "cliente"
cliente_dominio: "{{ cliente_subdomain }}.lab.local"

# EN: Client server IP
# ES: IP del servidor cliente
cliente_ip: "192.168.56.60"

# EN: Core infrastructure services
# ES: Servicios core de infraestructura
core_services:
  reverse_proxy: true
  dns: true
  homepage: true
  monitoring: false
  backup: false

# EN: Enable or disable applications declaratively
# ES: Activar o desactivar aplicaciones de forma declarativa
apps:
  nginx_test: true
  portainer_agent: false
  vaultwarden: true
  uptime_kuma: true
  technitium: true
  nextcloud: false
  duplicati: false

# EN: Services automatically removed if disabled
# ES: Servicios eliminados automáticamente si están desactivados
apps_absent_manage:
  - nextcloud
  - homepage
  - vaultwarden
  - uptime_kuma
  - technitium
  - duplicati
  - portainer_agent

cliente_monitoring: true
cliente_backup: true

# EN: Git repositories and stacks deployed automatically
# ES: Repositorios Git y stacks desplegados automáticamente
deploy_repositories:
  - repo_name: "msp-docker-apps"
    repo_url: "git@github.com:Harlock-code/msp-docker-apps.git"
    docker_stacks:
      - nginx-test
